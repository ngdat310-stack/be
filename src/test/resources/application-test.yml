spring:
  datasource:
    url: jdbc:h2:mem:dinechain;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # H2 cannot run the PostgreSQL migration; tests build the schema from the entities instead
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.dinechain: INFO
    org.springframework.security: WARN

dinechain:
  demo-data:
    enabled: false
  # Order totals in most tests are plain sums; VAT has its own tests that set the rate explicitly
  vat-percent: 0
