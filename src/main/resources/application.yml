# Production-safe defaults. Local development uses application-dev.yml, active by default;
# a real server runs with SPRING_PROFILES_ACTIVE=prod and DB_URL / DB_USERNAME / DB_PASSWORD set.
spring:
  application:
    name: DineChain
  profiles:
    default: dev
  jpa:
    # Release the DB connection as soon as the service is done, not after the JSON is written (measured: ~3x throughput at peak)
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
    show-sql: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false

  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:certs/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:certs/public_key.pem}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

dinechain:
  cors:
    # Front-end origins allowed to call the API, comma separated (wildcards allowed)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # 9 demo branches + accounts with well-known passwords; only ever enabled in the dev profile
  demo-data:
    enabled: false
  # VAT used until the owner sets one via PUT /settings/vat (8% = reduced rate for restaurants until end of 2026)
  vat-percent: 8
  loyalty:
    # 1 point per this many VND paid on a completed order
    earn-per: 10000
    # VND one point is worth when spent
    point-value: 1000
  kitchen:
    # Max dish portions waiting/cooking per branch before takeaway & delivery are paused.
    # Override per branch with branches.kitchen_capacity (PUT /branches/{id}).
    default-capacity: 40

logging:
  level:
    root: INFO
    com.dinechain: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
